# Builds the installable Android app (APK) and publishes it on the
# repository's Releases page as "Lamora Android app (latest)".
#
# - With the signing secrets set (see docs/INSTALL.md), the APK is a signed
#   release build and every new version installs over the previous one.
# - Without them, a debug-signed APK is built instead. It installs and runs
#   the same, but a later build may need the old app uninstalled first.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK on the Releases page

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and build the web app
        run: |
          npm ci
          npm run build

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Prepare signing key (if configured)
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.LAMORA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lamora.jks"
            echo "LAMORA_KEYSTORE_FILE=$RUNNER_TEMP/lamora.jks" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No signing secrets set — building a debug-signed APK."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          LAMORA_KEYSTORE_PASSWORD: ${{ secrets.LAMORA_KEYSTORE_PASSWORD }}
          LAMORA_KEY_ALIAS: ${{ secrets.LAMORA_KEY_ALIAS }}
          LAMORA_KEY_PASSWORD: ${{ secrets.LAMORA_KEY_PASSWORD }}
          LAMORA_VERSION_CODE: ${{ github.run_number }}
          LAMORA_VERSION_NAME: 2.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Lamora.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Lamora.apk"
          fi
          ls -la "$RUNNER_TEMP/Lamora.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Lamora-apk
          path: ${{ runner.temp }}/Lamora.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/Lamora.apk" \
            --title "Lamora Android app (latest)" \
            --notes "Install on an Android phone or tablet: open this page on the device, tap **Lamora.apk**, then allow installing from your browser when Android asks. Build ${{ github.run_number }} (${{ steps.sign.outputs.mode }}) from ${{ github.sha }}." \
            --target "${{ github.sha }}" --latest
