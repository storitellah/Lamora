<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Lamora mark: a rising sun over an open book-hill.
       Clean geometry only: rounded square, circle, two arcs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d6df0"/>
      <stop offset="1" stop-color="#38b6f5"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- sun -->
  <circle cx="60" cy="52" r="19" fill="#ffd766"/>
  <!-- hill / open pages -->
  <path d="M14 96 Q37 66 60 84 Q83 66 106 96 Z" fill="#ffffff" opacity="0.95"/>
  <!-- little star accent -->
  <circle cx="90" cy="28" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
